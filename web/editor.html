<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"><!-- 网页的宽度自动适应手机屏幕的宽度 -->
    <title>Loading</title>
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="/libs/monaco-editor@0.55.1/min/vs/editor/editor.main.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        html {
            overflow: hidden;
        }
        #container {
            width: 100%;
            height: 100%;
        }
        #btn {
            position: fixed; bottom: 40px; right: 40px; /* 固定定位在屏幕右下角 */
            z-index: 5; /* 高于编辑器（4），低于弹窗（6） */
            width: 40px; height: 40px; /* 固定大小为 40x40 */
            display: flex;
            align-items: center; /* 指定内部 svg 图片垂直居中展示 */
            justify-content: center;
            background-color: white;
            border-radius: 50%;
            cursor: pointer;
            transition-duration: .3s;
            box-shadow: 0 0 8px 0 rgb(255, 255, 255, 0.82);
            -webkit-tap-highlight-color: transparent; /* 去除移动端点击后出现的阴影 */
        }
        #btn:active {
            box-shadow: none;
            transform: scale(0.95);
        }
        #dialog {
            position: fixed;
            z-index: 6; /* 高于主按钮（5） */
            inset: 0;
            background: rgba(0, 0, 0, .4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #dialog button {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            color: #cccccc;
            transition: .15s;
        }
        #dialog button:hover {
            background: #2a2d2e;
        }
        #dialog > div > div:nth-of-type(2) > div {
            position: absolute;
            inset: 0;
        }
        #dialog .console {
            overflow: auto;
            padding: 12px;
            white-space: pre-wrap;
            font-family: 'Cascadia Code', 'Consolas', monospace;
            font-size: 13px;
        }
        #dialog .console .console-line {
            color: #d4d4d4;
        }
        #dialog .console .console-line.debug {
            color: #808080;
        }
        #dialog .console .console-line.info {
            color: #d4d4d4;
        }
        #dialog .console .console-line.warn {
            color: #dcdcaa;
        }
        #dialog .console .console-line.error {
            color: #f44747;
        }
    </style>
</head>

<body>
    <div id="container"></div>
    <div id="btn" style="display: none;">
        <svg style="display: none;" viewBox="0 0 512 512" width="24" height="24"><path d="M336 112a80 80 0 0 0-160 0v96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"></path><rect x="96" y="208" width="320" height="272" rx="48" ry="48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"></rect></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div id="dialog" style="visibility: hidden;">
        <div style="min-width: 300px; min-height: 200px; width: 80%; height: 80%; background: #252526; border: 1px solid #3c3c3c; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden;">
            <div style="display: flex; align-items: center; padding: 8px 12px; border-bottom: 1px solid #3c3c3c;">
                <h3 style="flex-grow: 1; color: #cccccc;"></h3>
                <button style="color: #f48771;">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <button style="color: #4ec9b0; margin-left: 8px; display: none;">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
            </div>
            <div style="flex-grow: 1; position: relative;"></div>
        </div>
    </div>
    <script src="/libs/typescript@5.9.2/lib/typescript.min.js"></script>
    <script src="/libs/sweetalert@2.1.2/dist/sweetalert.min.js"></script>
    <script src="/libs/monaco-editor@0.55.1/min/vs/loader.js"></script>
    <script>
        require.config({ paths: { "vs": window.location.origin + "/libs/monaco-editor@0.55.1/min/vs" } })
        require(["vs/editor/editor.main"], (app => app.mount.bind(app))({
            // 示例模板代码
            examples: {
                controller: `export default function (ctx: ServiceContext): ServiceResponse | Uint8Array | any {\n    return "hello, world"\n}`,
                controller2: `export default (app => app.run.bind(app))(new class {\n    public run(ctx: ServiceContext) {\n        return "hello, world"\n    }\n})`,
                typescript: `export default function () {\n    \n}`,
                html: `<!DOCTYPE html>\n<html>\n\n<head>\n    <meta charset="utf-8" />\n    <title></title>\n</head>\n\n<body>\n    hello, {{ .name }}\n</body>\n\n</html>`,
                vue: `<template>\n    <p>hello, {{ name }}</p>\n</template>\n\n\x3Cscript>\n    module.exports = {\n        data: function() {\n            return {\n                name: "world"\n            }\n        }\n    }\n\x3C/script>\n\n<style scoped>\n\n</style>`,
                json: `{\n\t\n}`,
            },

            // 页面模型对象，用于双向绑定
            vdata: (function (data, funcs = {}) {
                return new Proxy(data, {
                    set(target, property, value) {
                        funcs[property]?.call(target, value)
                        target[property] = value
                    },
                })
            })({
                state: "loading", // 状态：loading（加载中）、locked（已锁定，源码只读）、unmodified（未修改）、modified（已修改）
                content: "", // 原始内容
                broadcaster: null, // 广播频道，用于跨页面通讯，如修改 module 源码时通知其它编辑器页面实时更新依赖
                version: "", // 版本号，即最后一次修改时间
            }, {
                state: state => {
                    const b = document.querySelector("#btn"),
                        [u, s] = b.children
                    switch (state) {
                        case "locked":
                            b.style.display = ""
                            u.style.display = ""
                            s.style.display = "none"
                            break
                        case "unmodified":
                            b.style.display = "none"
                            break
                        case "modified":
                            b.style.display = ""
                            u.style.display = "none"
                            s.style.display = ""
                            break
                        default:
                            break
                    }
                },
            }),

            // 请求入参
            input: (function () {
                // 获取 URL 查询参数
                const params = new URL(window.location).searchParams,
                    name = params.get("name"),
                    type = params.get("type"),
                    example = params.has("example")

                // 获取代码坐标锚点
                const groups = window.location.hash.substring(1).match(/(?<startLineNumber>\d*),(?<startColumn>\d*)-(?<endLineNumber>\d*),(?<endColumn>\d*)/)?.groups,
                    selection = {
                        ...(groups?.startLineNumber && {
                            startLineNumber: Number(groups.startLineNumber),
                            startColumn: Number(groups.startColumn) || 0,
                        }),
                        ...(groups?.endLineNumber && {
                            endLineNumber: Number(groups.endLineNumber),
                            endColumn: Number(groups.endColumn) || 0,
                        }),
                    }

                return { name, type, selection, example, }
            })(),

            // 渲染 Monaco Editor
            render(lang) {
                const that = this,
                    language = { vue: "html" }[lang] || lang

                if (language === "typescript") {
                    // 初始化编辑器的编译选项
                    monaco.languages.typescript.typescriptDefaults.setCompilerOptions({
                        allowNonTsExtensions: true, // 允许文件名（如 createModel 中的 uri）可以不包含 ".ts" 扩展名（默认为 false，则文件名必须包含 ".ts" 扩展名，否则将出现异常："Could not find source file"）
                        experimentalDecorators: false, // 由于当前已支持新的装饰器语法（typescript 5.0 及以上版本），因此需要禁用旧的实验性装饰器语法，否则将影响新语法的识别
                        downlevelIteration: true, // 允许迭代器进行迭代
                        lib: ["esnext"], // 引用的库，如果不指定则默认会包含所有的库（如 "dom"、"scripthost" 等）
                        moduleResolution: ts.ModuleResolutionKind.NodeJs, // 指定使用 nodejs 模块解析策略，否则在 import node_modules/* 时无法解析模块
                    })

                    // 设置编辑器的代码自动补全
                    monaco.languages.registerCompletionItemProvider("typescript", {
                        provideCompletionItems: function() {
                            return {
                                suggestions: [
                                    ...(that.input.type === "controller" && [
                                        {
                                            label: "main",
                                            insertText: that.examples.controller2,
                                        },
                                    ] || []),
                                ],
                            }
                        },
                    })

                    // 预加载全局类型声明文件
                    Array.from([
                        "global.d.ts",
                        that.input.type === "controller" && "global.controller.d.ts",
                    ]).filter(i => i).forEach(uri => {
                        fetch(uri).then(r => r.text()).then(t => {
                            monaco.languages.typescript.typescriptDefaults.addExtraLib(t, uri)
                        })
                    })

                    // 预加载自定义模块
                    fetch("source?type=module&size=999&content").then(r => r.json()).then(r => {
                        r.data.sources?.filter(i => i.name !== that.input.name || i.type !== that.input.type)?.forEach(s => {
                            monaco.languages.typescript.typescriptDefaults.addExtraLib(s.content, s.name + ".ts")
                        })
                    })

                    // 注册广播通道，并监听自定义模块更新事件消息
                    if (typeof BroadcastChannel !== "undefined") {
                        that.broadcaster = new BroadcastChannel("cube")
                        that.broadcaster.onmessage = function({ data }) {
                            if (data.action === "update" && data.type === "module") {
                                fetch(`source?name=${data.name}&type=${data.type}`).then(r => r.json()).then(r => {
                                    r.data.sources?.forEach(s => {
                                        monaco.languages.typescript.typescriptDefaults.addExtraLib(s.content, s.name + ".ts")
                                    })
                                })
                            }
                        }
                    }

                    // 劫持诊断错误提示
                    const setModelMarkers = monaco.editor.setModelMarkers
                    monaco.editor.setModelMarkers = (model, owner, markers) => {
                        return setModelMarkers(model, owner, markers.filter(i => {
                            // 忽略外部 module 链接诊断错误
                            if (i.code === "2307" && /^Cannot find module 'https?:\/\/.*' or its corresponding type declarations.$/.test(i.message)) {
                                return false
                            }
                            return true
                        }))
                    }
                }

                // 创建 editor
                const editor = monaco.editor.create(document.querySelector("#container"), {
                    language,
                    theme: "vs-dark",
                    model: monaco.editor.createModel(that.examples[that.input.type] || that.examples[lang] || "", language, new monaco.Uri("noname")),
                    options: {
                        selectOnLineNumbers: true,
                        roundedSelection: false,
                        readOnly: false,
                        cursorStyle: "line",
                        automaticLayout: true,
                    },
                })

                // 重写 editorService 的 openEditor 方法，实现代码的跳转定义
                editor._codeEditorService.doOpenEditor = function (editor, input) {
                    const model = this.findModel(editor, input.resource),
                        selection = input.options.selection
                    if (model) {
                        editor.setModel(model)
                        that.setEditorFocus(editor, selection)
                        return
                    }
                    const matches = input.resource.path.match(/^(?:\/(node_modules\/\w+)|\.?\/(\w+))\.ts$/),
                        name = matches?.[1] || matches?.[2]
                    if (name) {
                        window.open(`/editor.html?name=${name}&type=module#${selection.startLineNumber},${selection.startColumn}-${selection.endLineNumber},${selection.endColumn}`)
                    }
                }

                // 注册事件以及按键命令
                editor.onDidFocusEditorText(() => {
                    if (that.vdata.state === "locked") {
                        document.activeElement.blur()
                    }
                })

                editor.onDidChangeModelContent(() => {
                    if (that.vdata.state !== "loading") {
                        that.vdata.state = editor.getValue() !== that.content ? "modified" : "unmodified"
                    }
                })

                if (language === "typescript") {
                    // 注册命令
                    editor.addAction({
                        id: "run",
                        label: "Run",
                        keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyR],
                        contextMenuGroupId: "navigation",
                        contextMenuOrder: 3,
                        run() {
                            const controller = new AbortController() // 中断控制器，用于主动中断 fetch 请求
                            that.dialog({
                                title: "Run",
                                mount: (c) => {
                                    const container = c.appendChild(Object.assign(document.createElement("div"), { className: "console" })),
                                        now = () => new Date().toISOString(),
                                        // 输出日志信息对象数组，每一条为 { datetime, level, message }，level 决定展示颜色（对应 console.log/debug/info/warn/error）
                                        print = (...infos) => {
                                            if (!container.isConnected) { // 弹窗已关闭，容器已移除时忽略写入
                                                return
                                            }
                                            for (const { datetime, level, message } of infos) {
                                                const msg = (datetime ? "[" + String(datetime).replace(/T/, " ").replace(/Z/, "") + "] " : "") + message
                                                if (msg) {
                                                    container.appendChild(Object.assign(document.createElement("div"), {
                                                        className: "console-line" + (level ? " " + level : ""),
                                                        innerText: msg,
                                                    }))
                                                }
                                            }
                                        }
                                    fetch("source", {
                                        method: "EVAL",
                                        body: that.compile(editor.getValue(), that.input.name),
                                        signal: controller.signal,
                                    }).then(async r => {
                                        if (!(r.headers.get("content-type") || "").includes("event-stream")) { // 非流式响应（如编译失败），读取 JSON 错误信息
                                            const { message } = await r.json().catch(() => ({}))
                                            print({ datetime: now(), level: "error", message: message || r.statusText })
                                            return
                                        }
                                        // 流式读取脚本执行的日志，实现非阻塞式运行
                                        const reader = r.body.getReader(),
                                            decoder = new TextDecoder()
                                        let buffer = ""
                                        while (true) {
                                            const { done, value } = await reader.read()
                                            if (done) {
                                                break
                                            }
                                            buffer += decoder.decode(value, { stream: true })
                                            let index
                                            while ((index = buffer.indexOf("\n")) >= 0) { // 按行解析 NDJSON 数据
                                                const line = buffer.slice(0, index).trim()
                                                buffer = buffer.slice(index + 1)
                                                if (!line) {
                                                    continue
                                                }
                                                const chunk = JSON.parse(line)
                                                if (chunk.level && "message" in chunk) { // 单条日志信息对象
                                                    print(chunk)
                                                }
                                            }
                                        }
                                    }).catch(e => {
                                        if (e.name !== "AbortError") { // 主动中断请求时忽略异常
                                            print({ datetime: now(), level: "error", message: e.message })
                                        }
                                    })
                                },
                                cancel: () => {
                                    controller.abort()
                                },
                            })
                        },
                    })
                }

                // 注册全局 resize 事件，当浏览器窗口大小发生改变时，编辑器自动调整大小
                window.onresize = () => editor.layout()

                // 注册 editor 快捷键
                that.setEditorShortcutKeys(editor)

                // 注册保存按钮的点击事件
                that.setBtnClick(editor)

                return editor
            },

            // 设置 editor 的光标位置
            setEditorFocus(editor, selection) {
                if (!selection || !Object.keys(selection).length) {
                    return
                }
                if (typeof selection.endLineNumber === "number" && typeof selection.endColumn === "number") {
                    editor.setSelection(selection)
                    editor.revealRangeInCenter(selection, 1)
                } else {
                    const position = {
                        lineNumber: selection.startLineNumber,
                        column: selection.startColumn,
                    }
                    editor.setPosition(position)
                    editor.revealPositionInCenter(position, 1)
                }
                editor.focus()
            },

            // 注册 editor 快捷键
            setEditorShortcutKeys(editor) {
                document.onkeydown = (e) => {
                    const keyCode = e.keyCode || e.which || e.charCode,
                        ctrlKey = e.ctrlKey || e.metaKey
                    if (ctrlKey && keyCode === 83) { // Ctrl + S
                        if (this.vdata.state === "loading" || this.vdata.state === "locked") {
                            return
                        }
                        this.onSourceSubmit(editor, editor.getValue())
                        return false
                    }
                }
            },

            // 注册保存按钮点击事件
            setBtnClick(editor) {
                document.querySelector("#btn").onclick = () => {
                    if (this.vdata.state === "locked") {
                        editor.updateOptions({ readOnly: false })
                        this.vdata.state = "unmodified"
                        return
                    }
                    if (editor.getValue() === this.content) {
                        return
                    }
                    this.onSourceSubmit(editor, editor.getValue())
                }
            },

            // 执行保存：内容不一致时拉起差异对比弹窗，确认后才提交
            onSourceSubmit(editor, content) {
                if (content === this.content) {
                    return
                }

                // 内容不一致时，拉起差异对比弹窗，确认后才提交
                this.dialog({
                    title: "Review Changes",
                    mount: (d) => {
                        const container = d.appendChild(document.createElement("div")),
                            lang = editor.getModel().getLanguageId(),
                            e = monaco.editor.createDiffEditor(container, {
                                theme: "vs-dark",
                                automaticLayout: true,
                                readOnly: true,
                                ignoreTrimWhitespace: false, // 禁止忽略行首和行末的空格
                            }),
                            original = monaco.editor.createModel(this.content, lang),
                            modified = monaco.editor.createModel(content, lang)
                        e.setModel({ original, modified, })
                        // 这里没有通过回调在关闭弹窗时释放资源（`return () => { e.dispose(); original.dispose(); modified.dispose(); }`），是因为 Monaco Editor 在高版本（＞ 0.49.*）中存在冲突：先创建 editor，再创建和释放 diff editor 时，原 editor（例如鼠标右键拉起菜单时）会出现异常："InstantiationService has been disposed"，详见 https://github.com/microsoft/monaco-editor/issues/4612
                    },
                    confirm: () => {
                        const compiled = editor.getModel().getLanguageId() !== "typescript" ? "" : this.compile(content, this.input.name)
                        this.submit(content, compiled)
                            .finally(() => {
                                this.vdata.state = editor.getValue() !== this.content ? "modified" : "unmodified"
                            })
                    },
                })
            },

            // 编译
            compile(src, name = "noname") {
                return ts.transpileModule(src, {
                    compilerOptions: {
                        module: ts.ModuleKind.CommonJS,
                        inlineSourceMap: true, // 使源映射文件（即 *.js.map 文件）在生成的 js 文件中内联写入：源映射内容会以 `//#soureMappingURL=` 开头，按 base64 格式追加写入
                        inlineSources: true, // 指定进一步将 ts 文件的内容也包含到输出文件中
                        removeComments: true, // 移除注释
                        downlevelIteration: true, // 当 target 为 ES5 或 ES3 时，为 for-of、spread 和 destructuring 中的迭代器提供完全支持
                        target: ts.ScriptTarget.ES5, // 指定编译目标 ES5 版本（ES2015 及以上版本的部分语法 goja 不兼容）
                    },
                    fileName: name + ".ts",
                })?.outputText
            },

            // 提交
            submit(content, compiled, version = this.vdata.version) {
                return fetch("source", {
                    method: "PUT",
                    body: JSON.stringify({
                        name: this.input.name,
                        type: this.input.type,
                        content,
                        compiled,
                        ...(version && {
                            last_modified_date: version,
                        }),
                    }),
                }).then(r => r.json()).then(r => {
                    if (r.code === "0") {
                        // 更新版本号和原始内容快照
                        this.vdata.version = r.data.last_modified_date
                        this.content = content
                        swal("Saved succeeded", "", "success")
                        // 如果是 module 类型，则发送广播消息，通知其它页面更新依赖
                        this.broadcaster && this.input.type === "module" && this.broadcaster.postMessage({
                            action: "update",
                            name: this.input.name,
                            type: this.input.type,
                        })
                        return
                    }
                    if (r.message === "source version conflict") {
                        return swal({
                            title: "Source version is conflict, continue to submit?",
                            buttons: {
                                cancel: true,
                                confirm: true,
                            },
                        }).then(value => value && this.submit(content, compiled, ""))
                    }
                    throw new Error(r.message)
                }).catch(e => {
                    swal(e.message, "", "error")
                })
            },

            // 弹框（title 标题、cancel 取消回调、confirm 确认回调、mount 内容渲染回调，接收内容容器，返回清理函数；容器每次拉起动态创建，关闭时移除）
            dialog(options) {
                const d = document.querySelector("#dialog"),
                    [t, c, s] = d.querySelector("div > div > div:first-of-type").children,
                    b = d.querySelector("div > div > div:nth-of-type(2)")
                if (d.style.visibility === "visible") { // 弹窗已打开时忽略重复拉起，避免泄漏
                    return
                }
                // 渲染弹窗主体
                const unmount = options?.mount?.(b),
                    close = () => {
                        unmount?.()
                        b.replaceChildren() // 移除动态创建的容器
                        d.style.visibility = "hidden"
                    }
                // 渲染弹窗头部
                t.innerText = options?.title ?? ""
                c.onclick = () => {
                    options?.cancel?.()
                    close()
                }
                s.style.display = options?.confirm ? "" : "none"
                s.onclick = () => {
                    options?.confirm?.()
                    close()
                }
                // 展示弹窗
                d.style.visibility = "visible"
            },

            // 初始化
            async mount() {
                if (!this.input.name) {
                    swal("name is required", "", "error")
                    return
                }

                // 根据 name 和 type 查询 source
                const source = (await fetch(`source?name=${this.input.name}&type=${this.input.type}&content`).then(r => r.json()).then(r => r.data.sources) || []).pop()
                if (!source) {
                    swal(`${this.input.type} "${this.input.name}" does not exist`, "", "error")
                    return
                }

                // 更新版本号
                this.vdata.version = source.last_modified_date

                // 渲染页面标题
                document.title = this.input.name + " - " + this.input.type

                const editor = this.render(source.lang)
                if (!!source.content || !this.input.example) {
                    editor.setValue(this.content = (source.content || ""))
                    this.setEditorFocus(editor, this.input.selection) // 光标跳转至指定代码位置
                    this.vdata.state = "locked"
                    editor.updateOptions({ readOnly: true, })
                    return
                }
                this.vdata.state = this.content !== editor.getValue() ? "modified" : "unmodified"
            },
        }))
    </script>
</body>

</html>
