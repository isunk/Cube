name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            bin: cube
            static: "1"
            ext: tar.gz
          - name: linux-arm64
            goos: linux
            goarch: arm64
            bin: cube
            static: "1"
            ext: tar.gz
          - name: windows-amd64
            goos: windows
            goarch: amd64
            bin: cube.exe
            static: "0"
            ext: zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum
      - name: Cache web libs
        uses: actions/cache@v6
        with:
          path: web/libs
          key: ${{ runner.os }}-libs-${{ hashFiles('web/*.html') }}
      - name: Set up Upx
        run: |
          sudo apt-get update
          sudo apt-get install -y upx
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: make build STATIC=${{ matrix.static }}
      - name: Compress
        run: |
          upx -9 -q -o .out ${{ matrix.bin }}
          mv .out ${{ matrix.bin }}
      - name: Package
        run: |
          asset="cube-latest-${{ matrix.name }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip -r "$asset" ${{ matrix.bin }} docs README.md LICENSE
          else
            tar -zcvf "$asset" ${{ matrix.bin }} docs README.md LICENSE
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cube-${{ matrix.name }}
          path: cube-latest-${{ matrix.name }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/cube-latest-*
          tag: latest
          release_name: latest
          overwrite: true
          file_glob: true
          body: ""